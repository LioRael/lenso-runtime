[package]
name = "polyglot-metrics"
version = "0.1.0"
edition = "2021"
publish = false

# This example builds independently without changing the Runtime workspace.
[workspace]

[dependencies]
runtime-sdk = { path = "../../../crates/sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "signal"] }
